  - id: federated-health-ai
    title: Privacy-preserving federated learning for clinical decision support
    description: >
      Federated learning across hospitals to train diagnostic models without
      centralizing patient data.
    keywords: [federated learning, differential privacy, clinical decision support]

  - id: ai-governance-digital-identity
    title: AI governance in public-sector digital identity systems
    description: >
      Governance, accountability, and risk controls for AI used in government
      digital identity and public-service eligibility decisions.
    keywords: [AI governance, digital identity, public sector, algorithmic accountability]
